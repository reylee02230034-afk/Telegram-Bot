services:
  postgres:
    image: postgres:15-alpine
    container_name: local-service-postgres
    command: postgres -c shared_buffers=64MB -c max_connections=100 -c work_mem=2MB
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: local_service
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 400m
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_CODE:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    container_name: local-service-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/local_service?schema=public
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
    volumes:
      - media_uploads:/app/storage/uploads
      - ./prisma:/app/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 700m
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    container_name: local-service-bot
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/local_service?schema=public
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 250m
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: local-service-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    mem_limit: 120m
    restart: unless-stopped

volumes:
  postgres_data:
  media_uploads:
  caddy_data:
  caddy_config:
